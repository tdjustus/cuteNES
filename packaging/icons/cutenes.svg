<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- cuteNES's icon: a gamepad with a heart, on a rounded tile. Drawn for
       this project; packaging/icons/make-icons.sh turns it into the PNG,
       .icns and .ico the packages need. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7eb3"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tile)"/>
  <!-- The pad's body. -->
  <rect x="76" y="176" width="360" height="184" rx="92" fill="#ffffff"/>
  <!-- D-pad. -->
  <rect x="134" y="248" width="96" height="40" rx="8" fill="#3b2f5c"/>
  <rect x="162" y="220" width="40" height="96" rx="8" fill="#3b2f5c"/>
  <!-- A and B. -->
  <circle cx="330" cy="288" r="22" fill="#ff5c93"/>
  <circle cx="384" cy="248" r="22" fill="#ff5c93"/>
  <!-- The heart above. -->
  <path d="M256 148 C 236 122, 196 130, 196 160 C 196 186, 230 204, 256 222 C 282 204, 316 186, 316 160 C 316 130, 276 122, 256 148 Z"
        fill="#ffffff" transform="translate(0,-40)"/>
</svg>
