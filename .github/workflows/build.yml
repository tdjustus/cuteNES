name: build

# Test once per change, on the PR. main only accepts PRs that are up to date
# with it (branch protection), so a post-merge run would repeat a tree that
# was already tested. Scheduled and tag runs catch runner-image drift and
# gate releases (constitution Principle IV).
on:
  pull_request:
  push:
    tags: ['core-v*', 'v*']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          # Anything that can change build or test results. Docs, specs and
          # Spec Kit scaffolding are deliberately absent.
          filters: |
            code:
              - 'core/**'
              - 'api/**'
              - 'mcp/**'
              - 'server/**'
              - 'qt/**'
              - 'app/**'
              - 'tests/**'
              - 'third_party/**'
              - 'packaging/**'
              - 'CMakeLists.txt'
              - '.gitmodules'
              - '.github/**'

  build-test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  buildtype: Release}
          - {os: macos-latest,   buildtype: Release}
          - {os: windows-latest, buildtype: Release}
          # MSVC Debug keeps checked iterators and assertions.
          - {os: windows-latest, buildtype: Debug}
    # Both Windows jobs build with MSVC (cl.exe). Without the developer
    # environment, Ninja would pick up the runner's MinGW g++ instead (#74).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # Ninja from the OS package manager. Windows uses the copy that ships
      # with Visual Studio, on PATH once the MSVC environment is loaded.
      # Ninja, plus the headers SDL3 needs for real audio and gamepad
      # backends on Linux (ALSA, PulseAudio, udev); without them it builds
      # only its dummy drivers.
      - name: Install Ninja and SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          libasound2-dev libpulse-dev libudev-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Qt for the GUI (feature 003). 6.8.3 is the oldest release the GUI
      # supports (research R1), so CI checks that floor; ShaderTools is for
      # the view's shaders. The action also installs Qt's Linux runtime
      # dependencies and puts Qt's bin directory on PATH.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.8.3'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}
          modules: qtshadertools
          cache: true

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.buildtype }}
          variant: ${{ matrix.os == 'windows-latest' && 'sccache' || 'ccache' }}

      # The x64 developer environment from vcvars64.bat: every variable it
      # adds or changes is exported to later steps (what msvc-dev-cmd did,
      # without a Node 20 action).
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools" }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      # Embedded (/Z7) debug info: sccache cannot cache MSVC's /Zi PDB writes.
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }}
          -DCMAKE_CXX_COMPILER=${{ runner.os == 'Windows' && 'cl' || 'c++' }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.os == 'windows-latest' && 'sccache' || 'ccache' }}
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DCUTENES_BUILD_GUI=ON

      # Fail fast if the Windows job ever falls back to another compiler.
      - name: Check the Windows compiler is MSVC
        if: runner.os == 'Windows'
        shell: bash
        run: grep -iE '^CMAKE_CXX_COMPILER:[A-Z]+=.*cl(\.exe)?$' build/CMakeCache.txt

      # -k 0: report every compile error in one run, not just the first.
      - name: Build
        run: cmake --build build -- -k 0

      # -j: playtest entries and test ROMs are independent processes.
      # Debug builds are slow, so on pull requests they run only the fast
      # groups (unit, tier1 incl. goldens, behavior, api); the full suite runs in
      # every Release job on every PR, and in Debug on tags and the weekly run.
      - name: Test (full)
        if: matrix.buildtype == 'Release' || github.event_name != 'pull_request'
        run: ctest --test-dir build --output-on-failure -j 4 -LE known-failing

      - name: Test (fast groups, Debug on pull requests)
        if: matrix.buildtype == 'Debug' && github.event_name == 'pull_request'
        run: ctest --test-dir build --output-on-failure -j 4 -L "unit|tier1|behavior|api|mcp|gui" -LE known-failing

      # Performance gate (constitution: no regression of real-time speed).
      # Shared runners are noisy, so CI fails only below 1.0x real-time; the
      # measured speed goes to the job summary for trend-watching. The spec's
      # 2x headroom is checked locally (rom_harness bench's default).
      - name: Benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.buildtype == 'Release'
        shell: bash
        run: |
          out=$(build/tests/rom_harness bench --rom tests/roms/other/BladeBuster.nes --seconds 5 --min-x 1.0) || status=$?
          echo "$out"
          echo "### Benchmark (ubuntu-latest, Release)" >> "$GITHUB_STEP_SUMMARY"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

  # Address + undefined-behavior sanitizers with assertions on. -O1 keeps
  # the instrumented run to minutes instead of the ~45 min of an -O0 build.
  # _GLIBCXX_ASSERTIONS adds libstdc++'s bounds and iterator checks, the GCC
  # counterpart of MSVC's checked iterators in the Windows Debug job.
  sanitize:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ubuntu-sanitize

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DCMAKE_CXX_FLAGS=-O1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -D_GLIBCXX_ASSERTIONS"
          -DCUTENES_BUILD_GUI=OFF

      # -k 0: report every compile error in one run, not just the first.
      - name: Build
        run: cmake --build build -- -k 0

      # The GUI is not built here (no Qt on this job); its code is covered
      # by the three-OS jobs and the MSVC Debug job.
      # Instrumented runs are ~5x slower: pull requests run the fast groups
      # (unit, tier1 incl. goldens, behavior, api: the threaded session code
      # runs under ASan/UBSan); tags and the weekly run
      # execute everything.
      - name: Test (full)
        if: github.event_name != 'pull_request'
        run: ctest --test-dir build --output-on-failure -j 4 -LE known-failing

      - name: Test (fast groups, pull requests)
        if: github.event_name == 'pull_request'
        run: ctest --test-dir build --output-on-failure -j 4 -L "unit|tier1|behavior|api|mcp" -LE known-failing

  # Packages (research R13): on tags, the weekly run and by hand, never on
  # pull requests. Each OS builds the app in Release, installs its `app`
  # component (Qt deployed into it by windeployqt or macdeployqt, or by
  # linuxdeploy for the AppImage), runs the packaged program as a smoke
  # test (a missing library or plugin fails here, not on a user's machine),
  # and uploads cuteNES-<version>-<os>-<arch>.<ext> (R16's naming) with its
  # SHA-256. The package-sums job gathers those into SHA256SUMS.
  package:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: an AppImage runs on systems at
          # least as new as the one it was built on (glibc).
          # package: CUTENES_PACKAGE, which lets the build install its own
          # updates (research R16); every other build is "none".
          - {os: ubuntu-22.04, platform: linux, package: appimage}
          - {os: macos-latest, platform: macos, package: macos-zip}
          - {os: windows-latest, platform: windows, package: windows-zip}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # 22.04's default compiler is GCC 11, older than the supported GCC 12
      # (README), and its -Wstringop-overflow false positives break the
      # -Werror build; GCC 12 still links 22.04's own libstdc++.
      - name: Install Ninja, GCC 12, SDL3 build dependencies and AppImage tools (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build g++-12
          libasound2-dev libpulse-dev libudev-dev libfuse2 xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.8.3'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}
          modules: qtshadertools
          cache: true

      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools" }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ runner.os == 'Windows' && 'cl' || runner.os == 'Linux' && 'g++-12' || 'c++' }}
          -DCUTENES_BUILD_GUI=ON
          -DCUTENES_BUILD_TESTS=OFF
          -DCUTENES_PACKAGE=${{ matrix.package }}

      - name: Build
        run: cmake --build build --target cutenes cutenes-server

      # The Linux AppDir needs the usr/ layout linuxdeploy expects. The
      # prefix is absolute: Qt's deploy script refuses a relative one, and
      # Windows' CMake wants a Windows path, not Git Bash's /d/a/...
      - name: Install the app component
        shell: bash
        run: |
          root=$(pwd)
          if [ "$RUNNER_OS" = Windows ]; then root=$(cygpath -m "$root"); fi
          prefix="$root/stage"
          if [ "$RUNNER_OS" = Linux ]; then prefix="$root/AppDir/usr"; fi
          cmake --install build --component app --prefix "$prefix"
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # Ad-hoc signed (R13): Gatekeeper still asks on first open, but
          # the bundle's code is consistent after macdeployqt's changes.
          codesign --force --deep --sign - stage/cutenes.app
          # The update check needs a TLS backend (R16; docs/packaging.md).
          ls stage/cutenes.app/Contents/PlugIns/tls/*.dylib
          stage/cutenes.app/Contents/MacOS/cutenes --version
          stage/cutenes.app/Contents/MacOS/cutenes-server --help
          name="cuteNES-$VERSION-macos-$(uname -m).zip"
          ditto -c -k --keepParent stage/cutenes.app "$name"
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # --version answers in a message box on Windows (no console), so
          # the smoke test is that the program starts and stays up: a
          # missing DLL ends it at once (STATUS_DLL_NOT_FOUND).
          # The update check needs a TLS backend (R16; docs/packaging.md).
          if (-not (Get-ChildItem stage\tls\*.dll)) { throw "no Qt TLS plugin in the package" }
          $p = Start-Process -FilePath stage\cutenes.exe -ArgumentList '--version' -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "cutenes.exe exited with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          & stage\cutenes-server.exe --help
          if ($LASTEXITCODE -ne 0) { throw "cutenes-server --help failed" }
          $name = "cuteNES-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path stage\* -DestinationPath $name
          "PACKAGE=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy "$base/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
          curl -fsSLo linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          name="cuteNES-$VERSION-linux-x86_64.AppImage"
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          export LDAI_OUTPUT="$name" OUTPUT="$name"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            --executable AppDir/usr/bin/cutenes \
            --executable AppDir/usr/bin/cutenes-server \
            --desktop-file AppDir/usr/share/applications/io.github.tdjustus.cutenes.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/cutenes.png
          chmod +x "$name"
          # The update check needs a TLS backend (R16; docs/packaging.md).
          ls AppDir/usr/plugins/tls/*.so
          xvfb-run -a "./$name" --version
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$PACKAGE" > "$PACKAGE.sha256"
          else shasum -a 256 "$PACKAGE" > "$PACKAGE.sha256"; fi
          cat "$PACKAGE.sha256"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE }}.sha256
          if-no-files-found: error

  # One SHA256SUMS for every package of the run (R16: the updater checks a
  # download against it).
  package-sums:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: packages
      - name: SHA256SUMS
        run: |
          cd packages
          cat ./*.sha256 | sed 's/\r$//' > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SHA256SUMS
          path: packages/SHA256SUMS
          if-no-files-found: error

  # The single required status check for branch protection. It passes when
  # the jobs above passed or were skipped (docs-only PRs), and fails if any
  # failed or was cancelled.
  ci-ok:
    if: always()
    needs: [changes, build-test, sanitize]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
             || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
